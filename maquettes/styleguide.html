<!doctype html>
<!-- lang : langue de la page, utilisee par les lecteurs d'ecran et les moteurs de recherche. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Sans cette balise, le mobile affiche la page en version desktop dezoomee. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Titre unique par page : "Nom de la page - Nom du site". C'est ce qui
       s'affiche dans l'onglet, l'historique et les resultats de recherche. -->
    <title>Guide de style - TechCorp RH</title>
    <meta
      name="description"
      content="Guide de style du design system de TechCorp RH"
    />

    <!-- Application interne : pas d'indexation par les moteurs de recherche. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/main.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Design system TechCorp RH</h1>
      <section aria-labelledby="Couleurs sémantiques">
        <h2>Couleurs sémantiques</h2>
        <div class="list">
          <div class="color">
            <div class="color__card color--primary"></div>
            <span class="color__label">--color-primary</span>
          </div>
          <div class="color">
            <div class="color__card color--primary-soft"></div>
            <span class="color__label">--color-primary-soft</span>
          </div>
          <div class="color">
            <div class="color__card color--text"></div>
            <span class="color__label">--color-text</span>
          </div>
          <div class="color">
            <div class="color__card color--text-muted"></div>
            <span class="color__label">--color-text-muted</span>
          </div>
          <div class="color">
            <div class="color__card color--bg"></div>
            <span class="color__label">--color-bg</span>
          </div>
          <div class="color">
            <div class="color__card color--success"></div>
            <span class="color__label">--color-success</span>
          </div>
          <div class="color">
            <div class="color__card color--warning"></div>
            <span class="color__label">--color-warning</span>
          </div>
          <div class="color">
            <div class="color__card color--danger"></div>
            <span class="color__label">--color-danger</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
